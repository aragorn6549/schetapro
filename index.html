<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СчетаПро — Вход</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Подключаем Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <h1>СчетаПро</h1>
        <div id="auth-forms">
            <form id="login-form" class="form">
                <h2>Вход</h2>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Пароль" required>
                <button type="submit">Войти</button>
                <p class="switch-link">Нет аккаунта? <a href="#" id="show-register">Зарегистрироваться</a></p>
            </form>
            <form id="register-form" class="form hidden">
                <h2>Регистрация</h2>
                <input type="text" id="reg-name" placeholder="ФИО" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" required>
                <button type="submit">Создать аккаунт</button>
                <p class="switch-link">Есть аккаунт? <a href="#" id="show-login">Войти</a></p>
            </form>
        </div>
        <div id="message" class="message hidden"></div>
    </div>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
